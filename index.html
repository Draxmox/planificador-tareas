<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Planificador Ágil</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: #1e293b;
            --bg-column: #111827;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo i {
            color: var(--accent);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-links li a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-links li.active a, .nav-links li a:hover {
            background-color: rgba(99, 102, 241, 0.15);
            color: var(--accent);
        }

        /* Main Content */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-main);
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* Board Container */
        .board-container {
            flex-grow: 1;
            padding: 25px 30px;
            display: flex;
            gap: 20px;
            overflow-x: auto;
        }

        .column {
            background-color: var(--bg-column);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 300px;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            max-height: 100%;
        }

        .column-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }

        .column-count {
            background-color: var(--border-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .task-list {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Task Card */
        .task-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            cursor: grab;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, border-color 0.2s;
        }

        .task-card:active {
            cursor: grabbing;
        }

        .task-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .task-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .task-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .task-delete:hover {
            color: var(--danger);
        }

        .task-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge.high { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge.medium { background-color: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge.low { background-color: rgba(16, 185, 129, 0.2); color: var(--success); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 400px;
            padding: 25px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div class="logo">
            <i class="fa-solid fa-layer-group"></i> TaskFlow Pro
        </div>
        <ul class="nav-links">
            <li class="active"><a href="#"><i class="fa-solid fa-columns"></i> Tablero Scrum</a></li>
            <li><a href="#"><i class="fa-solid fa-list-check"></i> Mis Tareas</a></li>
            <li><a href="#"><i class="fa-solid fa-chart-pie"></i> Reportes</a></li>
            <li><a href="#"><i class="fa-solid fa-gear"></i> Configuración</a></li>
        </ul>
    </aside>

    <!-- Main Section -->
    <main>
        <header>
            <div class="header-title">
                <h1>Sprint 1 - MVP Development</h1>
            </div>
            <button class="btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Nueva Tarea</button>
        </header>

        <!-- Kanban Board -->
        <div class="board-container">
            <!-- Column: Todo -->
            <div class="column" data-status="todo">
                <div class="column-header">
                    <span>Por hacer</span>
                    <span class="column-count" id="count-todo">0</span>
                </div>
                <div class="task-list" id="list-todo" ondragover="allowDrop(event)" ondrop="drop(event, 'todo')"></div>
            </div>

            <!-- Column: In Progress -->
            <div class="column" data-status="inprogress">
                <div class="column-header">
                    <span>En progreso</span>
                    <span class="column-count" id="count-inprogress">0</span>
                </div>
                <div class="task-list" id="list-inprogress" ondragover="allowDrop(event)" ondrop="drop(event, 'inprogress')"></div>
            </div>

            <!-- Column: Review -->
            <div class="column" data-status="review">
                <div class="column-header">
                    <span>En revisión</span>
                    <span class="column-count" id="count-review">0</span>
                </div>
                <div class="task-list" id="list-review" ondragover="allowDrop(event)" ondrop="drop(event, 'review')"></div>
            </div>

            <!-- Column: Done -->
            <div class="column" data-status="done">
                <div class="column-header">
                    <span>Hecho</span>
                    <span class="column-count" id="count-done">0</span>
                </div>
                <div class="task-list" id="list-done" ondragover="allowDrop(event)" ondrop="drop(event, 'done')"></div>
            </div>
        </div>
    </main>

    <!-- Modal Create Task -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h2>Crear Nueva Tarea</h2>
            <form id="taskForm" onsubmit="handleCreateTask(event)">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="taskTitle" required placeholder="Ej: Configurar base de datos SQL">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="taskDesc" placeholder="Detalles de la tarea..."></textarea>
                </div>
                <div class="form-group">
                    <label>Prioridad</label>
                    <select id="taskPriority">
                        <option value="low">Baja</option>
                        <option value="medium" selected>Media</option>
                        <option value="high">Alta</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [
            { id: 1, title: 'Diseñar arquitectura C4', desc: 'Definir contenedores y componentes del sistema.', status: 'todo', priority: 'high' },
            { id: 2, title: 'Implementar ETL en Python', desc: 'Extraer y transformar datos hacia el Data Lakehouse.', status: 'inprogress', priority: 'medium' }
        ];

        function renderTasks() {
            const statuses = ['todo', 'inprogress', 'review', 'done'];
            
            statuses.forEach(status => {
                const container = document.getElementById(`list-${status}`);
                container.innerHTML = '';
                
                const filteredTasks = tasks.filter(t => t.status === status);
                document.getElementById(`count-${status}`).innerText = filteredTasks.length;

                filteredTasks.forEach(task => {
                    const card = document.createElement('div');
                    card.className = 'task-card';
                    card.draggable = true;
                    card.ondragstart = (e) => drag(e, task.id);
                    
                    card.innerHTML = `
                        <div class="task-header">
                            <span class="task-title">${task.title}</span>
                            <button class="task-delete" onclick="deleteTask(${task.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <p class="task-desc">${task.desc}</p>
                        <div class="task-footer">
                            <span class="badge ${task.priority}">${task.priority.toUpperCase()}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });

            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function openModal() {
            document.getElementById('taskModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            document.getElementById('taskForm').reset();
        }

        function handleCreateTask(e) {
            e.preventDefault();
            const newTask = {
                id: Date.now(),
                title: document.getElementById('taskTitle').value,
                desc: document.getElementById('taskDesc').value,
                status: 'todo',
                priority: document.getElementById('taskPriority').value
            };

            tasks.push(newTask);
            renderTasks();
            closeModal();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        // Drag and Drop Logic
        let draggedTaskId = null;

        function drag(e, id) {
            draggedTaskId = id;
        }

        function allowDrop(e) {
            e.preventDefault();
        }

        function drop(e, newStatus) {
            e.preventDefault();
            const task = tasks.find(t => t.id === draggedTaskId);
            if (task) {
                task.status = newStatus;
                renderTasks();
            }
        }

        // Initial Render
        renderTasks();
    </script>
</body>
</html>
